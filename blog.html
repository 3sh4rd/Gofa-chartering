<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog | Aquaholic Adventures</title>
<meta name="description" content="Tips, stories and updates from Aquaholic Adventures in Nassau, Bahamas." />
<link rel="icon" href="favicon.png?v=3" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a2b4e;--navy-deep:#071f3a;--teal:#12b6c9;--teal-light:#3fd3e0;--gold:#f6c31d;--muted:#5b7591}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;color:#0c2033;background:#eef6fb;line-height:1.55}
  a{text-decoration:none;color:inherit}
  .wrap{max-width:1000px;margin:0 auto;padding:0 22px}
  header{background:linear-gradient(90deg,var(--navy-deep),var(--navy))}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:1240px;margin:0 auto}
  .brand-logo{height:52px;width:auto;display:block}
  header nav a{color:#e7f3ff;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-left:22px}
  header nav a:hover{color:var(--gold)}
  .hero-strip{background:radial-gradient(120% 120% at 50% -20%,rgba(63,211,224,.5),transparent 60%),linear-gradient(180deg,#0e7fb0,#0a2b4e);color:#fff;text-align:center;padding:54px 0 46px}
  .hero-strip .ey{color:var(--teal-light);font-weight:800;letter-spacing:3px;text-transform:uppercase;font-size:13px}
  .hero-strip h1{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:52px;text-transform:uppercase;letter-spacing:1px;margin:8px 0}
  .hero-strip .s{font-family:'Kaushan Script',cursive;color:var(--gold);font-size:30px}
  main{padding:44px 0 70px}
  #soro-blog{max-width:960px;margin:0 auto;min-height:200px}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
  footer{background:var(--navy-deep);color:#9fb9d4;text-align:center;padding:26px 22px;font-size:13px}
  footer a{color:var(--gold)}
  @media(max-width:640px){.hero-strip h1{font-size:38px}.brand-logo{height:42px}header nav a{margin-left:14px;font-size:12px}}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <a href="index.html"><img class="brand-logo" src="aquaholic-logo.png" alt="Aquaholic Adventures — Nassau, Bahamas" /></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#tours">Tours</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<section class="hero-strip">
  <div class="wrap">
    <div class="ey">News &amp; Stories</div>
    <h1>The <span class="s">Blog</span></h1>
    <p>Tips, stories and updates from the islands.</p>
  </div>
</section>

<main>
  <div class="wrap">
    <div id="soro-blog"><div class="loading">Loading posts…</div></div>
  </div>
</main>

<footer>
  © 2026 Aquaholic Adventures · Nassau, The Bahamas · <a href="index.html">Back to site</a>
</footer>

<script src="https://app.trysoro.com/api/embed/f1dba57c-57f4-4b26-bbda-7b8655629c18" defer></script>
</body>
</html>
