<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Booking Confirmation | Aquaholic Adventures</title>
<link rel="icon" href="favicon.png?v=3" type="image/png" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(120% 90% at 70% -10%,rgba(63,211,224,.5),transparent 55%),linear-gradient(180deg,#1aa9c4,#0a4f86 60%,#0a2b4e);color:#fff}
  .box{max-width:520px;background:rgba(7,31,58,.35);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:40px 30px;backdrop-filter:blur(4px)}
  h1{font-family:'Anton',Impact,sans-serif;font-size:44px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  p{font-size:16px;opacity:.95;margin-bottom:8px}
  .ref{display:inline-block;background:#f6c31d;color:#071f3a;font-weight:800;border-radius:20px;padding:5px 16px;margin:14px 0}
  a.btn{display:inline-block;margin-top:18px;background:#fff;color:#0a2b4e;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:13px 28px;border-radius:12px;text-decoration:none}
  .bad h1{color:#ffd7cf}
</style>
</head>
<body>
  <div class="box" id="box"></div>
<script>
  var p = new URLSearchParams(location.search);
  var ref = p.get('ref') || '';
  var status = (p.get('status') || '').toLowerCase();
  try { sessionStorage.removeItem('aquaBooking'); } catch(e){}
  var box = document.getElementById('box');
  if (status === 'success') {
    box.innerHTML = '<h1>Thank You!</h1>' +
      '<p>Your deposit is paid and your booking is confirmed. A confirmation has been sent to your email.</p>' +
      (ref ? '<div class="ref">Booking ' + ref + '</div>' : '') +
      '<p>We can\'t wait to see you on the water!</p>' +
      '<a class="btn" href="index.html">Back to Home</a>';
  } else {
    document.body.classList.add('bad');
    box.innerHTML = '<h1>Payment Not Completed</h1>' +
      '<p>Your payment wasn\'t completed, so no booking was confirmed.</p>' +
      (ref ? '<div class="ref">Ref ' + ref + '</div>' : '') +
      '<p>You can try again, or contact us at +1 (242) 427-5699.</p>' +
      '<a class="btn" href="booking.html">Try Again</a>';
  }
</script>
</body>
</html>
